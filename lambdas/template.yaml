AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TwoThirds backend with Lambda functions and DynamoDB

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'GET,POST,OPTIONS'"

Resources:
  TwoThirdsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TwoThirdsGuesses
      AttributeDefinitions:
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: timestamp
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  SubmitGuessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.submitGuess
      Policies:
        - Statement:
            - Effect: Allow
              Action:
              - dynamodb:Scan
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              Resource: !GetAtt TwoThirdsTable.Arn
      Environment:
        Variables:
          GUESSES_TABLE_NAME: !Ref TwoThirdsTable
      Events:
        SubmitGuess:
          Type: Api
          Properties:
            Path: /submit-guess
            Method: post

  GetRoundCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.getRoundCount
      Policies:
        - Statement:
            - Effect: Allow
              Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Scan
              Resource: !GetAtt TwoThirdsTable.Arn
      Environment:
        Variables:
          GUESSES_TABLE_NAME: !Ref TwoThirdsTable
      Events:
        RoundCount:
          Type: Api
          Properties:
            Path: /round-count
            Method: get

  GetLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.getLeaderboard
      Policies:
        - Statement:
            - Effect: Allow
              Action:
              - dynamodb:Scan
              Resource: !GetAtt TwoThirdsTable.Arn
      Environment:
        Variables:
          GUESSES_TABLE_NAME: !Ref TwoThirdsTable
      Events:
        GetLeaderboard:
          Type: Api
          Properties:
            Path: /leaderboard
            Method: get

  GetPreviousResultsFunction2:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.getPreviousResults
      Policies:
        - Statement:
            - Effect: Allow
              Action:
              - dynamodb:Scan
              Resource: !GetAtt TwoThirdsTable.Arn
      Environment:
        Variables:
          GUESSES_TABLE_NAME: !Ref TwoThirdsTable
      Events:
        GetPreviousResults:
          Type: Api
          Properties:
            Path: /previous-results
            Method: post
